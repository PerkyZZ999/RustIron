[package]
name = "rustiron-fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Keep fuzz-only dependencies out of the product lock and release graph.
[workspace]
members = ["."]
resolver = "3"

[dependencies]
libfuzzer-sys = "=0.4.13"
rustiron-contracts = { path = "../crates/contracts", version = "=0.1.1" }
rustiron-executor = { path = "../crates/executor", version = "=0.1.1" }
rustiron-journal = { path = "../crates/journal", version = "=0.1.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }

[[bin]]
name = "canonical_object"
path = "fuzz_targets/canonical_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prepared_plan"
path = "fuzz_targets/prepared_plan.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

