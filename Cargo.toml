[workspace]
members = ["crates/contracts", "crates/core", "crates/control", "crates/cli", "crates/journal", "crates/executor"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rustix = { version = "=1.1.5", features = ["net", "process", "event", "system", "fs", "rand", "thread"] }
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled"] }
rustiron-core = { path = "crates/core", version = "=0.1.1" }
rustiron-contracts = { path = "crates/contracts", version = "=0.1.1" }
rustiron-control = { path = "crates/control", version = "=0.1.1" }
rustiron-journal = { path = "crates/journal", version = "=0.1.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
serde_json_canonicalizer = "=0.4.1"
sha2 = { version = "=0.11.1", default-features = false }

[workspace.lints.rust]
# D-020 (W331): `deny`, not `forbid`, so crates/executor/src/peer_label.rs
# can carry the one recorded exception; tests/unsafe_scope.rs guards the scope.
unsafe_code = "deny"
# D-029 (W371) retired `rustiron_write_proof`; the product profile alone opens
# the capture write gate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rustiron_profile, values("product"))'] }
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
