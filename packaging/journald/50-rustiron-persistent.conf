# W486 (W484-F3): keep the system journal across boots and power cuts, so the
# logs of what happened before a cut, including Rustiron's, are still there.
# W486-F2: journald writes to disk every 5 minutes by default, so a power cut
# lost the last minutes; sync at most every 10 seconds.
[Journal]
Storage=persistent
SyncIntervalSec=10s
