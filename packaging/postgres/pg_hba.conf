# Rustiron (W658, D-102 Decision C2): strict loopback & per-site database
# access rules for PostgreSQL 18 (/var/lib/pgsql/18/data/pg_hba.conf).
# - Local postgres superuser authenticates ONLY via kernel peer credentials.
# - Each site role (rs_<site>) may authenticate ONLY to its own same-named
#   database over local Unix socket or loopback TCP with SCRAM-SHA-256.
# - Zero trust, zero md5, zero non-loopback client addresses.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   sameuser        all                                     scram-sha-256
host    sameuser        all             127.0.0.1/32            scram-sha-256
host    sameuser        all             ::1/128                 scram-sha-256
