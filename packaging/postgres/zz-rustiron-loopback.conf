# Rustiron (W658, D-102 Decision C2): PostgreSQL 18 answers on loopback only
# and requires SCRAM-SHA-256 authentication. Drop into
# /var/lib/pgsql/18/data/conf.d/zz-rustiron-loopback.conf after initdb.
listen_addresses = '127.0.0.1'
port = 5432
password_encryption = 'scram-sha-256'
log_connections = on
log_disconnections = on
