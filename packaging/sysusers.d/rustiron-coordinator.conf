# Rustiron coordinator identity (B05/W234). The executor socket's group is
# rustiron-requesters. Only the coordinator unit joins it, through
# SupplementaryGroups=; the user is not a member, so the Console, which runs
# as the same user, cannot reach the executor socket (W764).
g rustiron-requesters -
u rustiron-coordinator - "Rustiron coordinator" /var/lib/rustiron-coordinator /usr/sbin/nologin
# D-059 (W462): the certbot account. It holds only the ACME state in
# /var/lib/rustiron-acme and the sites' HTTP-01 webroots.
u rustiron-acme - "Rustiron ACME client" /var/lib/rustiron-acme /usr/sbin/nologin
# D-102 (W657): confined Caddy edge ingress account (read-only config and
# read-only shared rustiron-acme TLS certificates; zero outbound internet).
u rustiron-caddy - "Rustiron Caddy ingress" /var/lib/rustiron-caddy /usr/sbin/nologin
