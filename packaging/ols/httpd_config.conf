# SPDX-License-Identifier: Apache-2.0
# Rustiron managed OpenLiteSpeed server configuration (W348, B01).
#
# The product installer writes this file once, as root:root 0644 with the
# immutable flag, and prints its SHA-256 for the enrollment policy
# (ols.parent_sha256). The executor accepts only these exact bytes.
# Any change is drift: edit the template, review it, and enroll the new digest.
#
# This file defines no listener, no virtual host, and no PHP application.
# The one include line at the end loads the Rustiron generation. The
# generation renders each listener, virtual host, and site PHP socket.

# Process identity and worker count.
# The per-client limits below count in each worker (W343). Four workers give
# about 60 soft and 120 hard connections for each client address.
user nobody
group nobody
httpdWorkers 4
showVersionNumber 0
# Per-client limits count the connecting address, never a forwarded header.
useIpInProxyHeader 0
mime $SERVER_ROOT/conf/mime.properties

# WebAdmin stays closed on a managed host (D-003).
disableWebAdmin 1

errorlog $SERVER_ROOT/logs/error.log {
  logLevel NOTICE
  debugLevel 0
  rollingSize 10M
  enableStderrLog 1
}

accesslog $SERVER_ROOT/logs/access.log {
  rollingSize 10M
  keepDays 30
  compressArchive 0
}

# D-028 item 1 server limits. The Rustiron include never overrides them.
# D-039 (W390): TLS defaults for every listener that sets none. TLS 1.2
# suites are ECDHE with an AEAD cipher only (no static RSA, no CBC). OLS
# already refuses TLS 1.0 and 1.1 and renegotiation. OLS 1.9.4 ignores a
# list that starts with an ECDHE GCM suite; for this list it stores
# ECDHE-ECDSA-CHACHA20-POLY1305, ECDHE-ECDSA-AES128-GCM-SHA256,
# ECDHE-RSA-AES128-GCM-SHA256, ECDHE-RSA-CHACHA20-POLY1305.
# HTTP/3 stays off until a campaign tests it.
tuning {
  maxConnections 10000
  keepAliveTimeout 5
  connTimeout 60
  maxReqBodySize 64M
  enableGzipCompress 1
  enableDynGzipCompress 1
  sslDefaultCiphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
  quicEnable 0
}

# Per worker values after the W346 revision of D-028 item 1.
perClientConnLimit {
  softLimit 15
  hardLimit 30
  gracePeriod 10
  banPeriod 60
}

# Served content never follows a symbolic link. Virtual hosts also set
# allowSymbolLink 0. Site files are group-readable by nobody, not
# world-readable (provisioning and the PHP unit's UMask), so no permission
# bit is required.
fileAccessControl {
  followSymbolLink 0
  checkSymbolLink 0
  requiredPermissionMask 000
  restrictedPermissionMask 000
}

accessDenyDir {
  dir /
  dir /etc/*
  dir /dev/*
  dir /root/*
  dir /var/lib/*
  dir $SERVER_ROOT/conf/*
  dir $SERVER_ROOT/admin/conf/*
}

accessControl {
  allow ALL
}

# D-037 (W387): OLS starts the PHP of an ejected site itself, as the site
# account, through its suEXEC daemon. The daemon starts nothing without this
# block (W387 run 1). It never starts a process as an account or group under
# 1000. Managed sites do not use it: systemd starts their PHP.
CGIRLimit {
  minUID 1000
  minGID 1000
}

# Page cache module (D-028 item 2, PAGE-CACHE.md). The server stores nothing
# by itself. A site's LiteSpeed Cache plugin marks what can be stored, and
# each opted-in virtual host sets its own storage path.
module cache {
  internal 1
  ls_enabled 1
  enableCache 0
  enablePrivateCache 0
  checkPublicCache 1
  checkPrivateCache 1
  qsCache 1
  reqCookieCache 1
  respCookieCache 1
  ignoreReqCacheCtrl 1
  ignoreRespCacheCtrl 0
}

include /etc/rustiron-ols/current/*.conf
