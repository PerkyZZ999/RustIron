# W381 (D-032): run the Rustiron OLS boot guard before OLS starts, so OLS
# never serves the target of an activation that a power cut left unverified.
# W382 (D-033): OLS starts only when the include link `current` exists. With
# no `current` (a fresh host, or the guard removed an unverified bootstrap
# target), systemd skips the start: the unit stays inactive, with no restart
# loop. systemd checks the condition after the guard. The check reads only
# the link itself (lstat): SELinux lets init_t get its attributes, and
# refuses init_t a read of the link, so ConditionPathExists (which follows
# the link) always failed under Enforcing mode (W382 run 1).
# W389 (D-038): OLS starts only when the live parent is byte-identical to
# the shipped template. The OLS package %posttrans restarts OLS on every
# upgrade, downgrade, and reinstall; with another parent, that restart
# served the package parent (WebAdmin on 0.0.0.0:7080) and no Rustiron
# site. A difference (cmp exit 1) or a missing file (exit 2) skips the
# start: the unit stays inactive, with no restart loop. A reload does not
# run this check; the executor refuses an activation with a drifted parent.
[Service]
ExecCondition=/usr/bin/cmp -s /usr/share/rustiron/ols/httpd_config.conf /usr/local/lsws/conf/httpd_config.conf
[Unit]
Wants=rustiron-ols-boot-guard.service
After=rustiron-ols-boot-guard.service
ConditionPathIsSymbolicLink=/etc/rustiron-ols/current
